name: CI

# Corre las pruebas de Brix en runners estándar. En un repositorio público no
# consume cuota de Actions (VCX-D032). Sin tokens: las pruebas no tocan la red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Pruebas
        run: node --test 'tests/**/*.test.mjs'
      - name: El CLI arranca
        run: node packages/cli/bin/brix.js
      - name: El paquete incluye sus motores
        run: |
          cd packages/cli
          npm pack --dry-run --json > /tmp/pack.json
          for dir in bin src scoring finops seeding; do
            node -e "const f=require('/tmp/pack.json')[0].files.map(x=>x.path); if(!f.some(p=>p.startsWith('$dir/'))){console.error('falta $dir/ en el paquete');process.exit(1)}"
          done
